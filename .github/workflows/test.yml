name: Security tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "fastapi==0.115.12" "httpx==0.28.1" "pytest==8.3.5"
      - run: python -m pytest -q test_app.py
